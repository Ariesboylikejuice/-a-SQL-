<style>
  :root{
    --bg:#0e1116; --panel:#151a21; --panel2:#1b222b; --line:#252d38;
    --tx:#e4e8ee; --tx2:#9aa5b4; --tx3:#7c8794;
    --accent:#3d9df6; --ok:#3ec98a; --warn:#e5a23c; --err:#f06a6a;

    --radius:10px;

    --td-tx:#cfd8e3; --row-line:#1a2029; --tr-hover:#131920;
    --btn2:#222a35; --btn2-bd:#3a4654;
    --accent-tx:#06121f; --accent-hover:#57adfb;
    /* 状态文字 */

    --ok-bg:rgba(62,201,138,.10); --ok-bd:rgba(62,201,138,.30);
    --err-bg:rgba(240,106,106,.09); --err-bd:rgba(240,106,106,.30);
    --info-bg:rgba(61,157,246,.08); --info-bd:rgba(61,157,246,.28);
    --warn-bg:rgba(229,162,60,.08); --warn-bd:rgba(229,162,60,.25);
    --hl-bd:#2a3a4d; --accent-ink:#3d9df6;
    --scrim:rgba(0,0,0,.35);
  }
  /* 亮色主题 */
  html[data-theme="light"]{
    --bg:#f4f6f9; --panel:#ffffff; --panel2:#eef2f7; --line:#dbe2ea;
    --tx:#1a2230; --tx2:#54606f; --tx3:#64707f;
    --accent:#1a73e8; --ok:#159a67; --warn:#b8790c; --err:#d33b3b;
    --accent-ink:#1656a8;

    --code-bg:#fbfcfe; --code-tx:#25303d; --code-hl:#1a5fae;
    --td-tx:#2b3644; --row-line:#edf1f6; --tr-hover:#f4f8fd;
    --btn2:#eef2f7; --btn2-bd:#bcc7d4;
    --accent-tx:#ffffff; --accent-hover:#1668d6;
    --ok-tx:#0b7248; --err-tx:#a82424; --info-tx:#12508f; --warn-tx:#7d5304;
    --ok-bg:#e8f8f0; --ok-bd:#b3e3cb;
    --err-bg:#fdeceb; --err-bd:#f3c0bd;
    --info-bg:#eaf2fd; --info-bd:#c3dbf8;
    --warn-bg:#fdf6e8; --warn-bd:#efdcb0;
    --hl-bd:#c6d9f2;

  *{box-sizing:border-box}

        justify-content:center;gap:14px;background:var(--bg);z-index:50;color:var(--tx2)}

function loadScript(src) {
  return new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = src; s.onload = res; s.onerror = () => rej(new Error(src));
    document.head.appendChild(s);
  });
}

let db = null, curIdx = 0, store = {};
const LS = 'sql-lab-v2';

function save() {
  try { localStorage.setItem(LS, JSON.stringify(store)); } catch (e) {}
}
function restore() {
  try { store = JSON.parse(localStorage.getItem(LS) || '{}'); } catch (e) { store = {}; }
}

/* ---------- 主题切换 ---------- */
const THEME_KEY = 'sqllab-theme';
function curTheme() {
  return document.documentElement.dataset.theme === 'light' ? 'light' : 'dark';
}
function paintThemeBtn() {
  const btn = document.getElementById('themeBtn');
  if (!btn) return;
  const light = curTheme() === 'light';
  btn.title = light ? '切换到深色主题' : '切换到浅色主题';
  btn.setAttribute('aria-label', btn.title);
}
function setTheme(t) {
  document.documentElement.dataset.theme = t;
  try { localStorage.setItem(THEME_KEY, t); } catch (e) {}
  /* 手动切换后清掉 ?theme=，避免刷新时被 URL 覆盖 */
  try {
    const u = new URL(location.href);
    if (u.searchParams.has('theme')) {
      u.searchParams.delete('theme');
      history.replaceState(null, '', u.pathname + (u.search || '') + u.hash);
    }
  } catch (e) {}
  paintThemeBtn();
}
function initTheme() {
  const btn = document.getElementById('themeBtn');
  if (!btn) return;
  paintThemeBtn();
  btn.addEventListener('click', () => setTheme(curTheme() === 'light' ? 'dark' : 'light'));
}

function fmtCell(v) {
  if (v === null || v === undefined) return '<span class="null">NULL</span>';
  if (typeof v === 'number') {
    return Number.isInteger(v)
      ? v.toLocaleString('zh-CN')
      : v.toLocaleString('zh-CN', { minimumFractionDigits: 1, maximumFractionDigits: 4 });
  }
  return String(v).replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
}

function renderTable(res, limit) {
  if (!res || !res.length) return '<div class="tblmeta">查询没有返回结果集（INSERT/UPDATE 之类），执行成功。</div>';
  const { columns, values } = res[0];
  const max = limit || 300;
  const rows = values.slice(0, max);
  let html = '<div class="tblwrap"><table><thead><tr>';
  columns.forEach((c) => { html += '<th>' + c + '</th>'; });
  html += '</tr></thead><tbody>';
  rows.forEach((r) => {
    html += '<tr>';
    r.forEach((v) => {
      const isNum = typeof v === 'number';
      html += '<td' + (isNum ? ' class="num"' : '') + '>' + fmtCell(v) + '</td>';
    });
    html += '</tr>';
  });
  html += '</tbody></table></div>';
  html += '<div class="tblmeta">返回 ' + values.length + ' 行 × ' + columns.length + ' 列';
  if (values.length > max) html += '（表格仅显示前 ' + max + ' 行）';
  html += '</div>';
  return html;
}

function showMsg(type, text) {
  const m = document.getElementById('msg');
  m.className = 'msg show ' + type;
  m.textContent = text;
}
function hideMsg() {
  document.getElementById('msg').className = 'msg';
}

function taskKey(i) { return TASKS[i].id; }
function getDraft(i) {
  const k = taskKey(i);
  return store[k] && store[k].sql ? store[k].sql : '';
}
function setDone(i, done) {
  const k = taskKey(i);
  store[k] = store[k] || {};
  store[k].done = done;
  save();
  renderNav();
}

function renderNav() {
  const nav = document.getElementById('nav');
  let html = '', last = '';
  let done = 0;
  TASKS.forEach((t, i) => {
    if (store[t.id] && store[t.id].done) done++;
    if (t.stage !== last) { html += '<div class="stage-t">' + t.stage + '</div>'; last = t.stage; }
    const cls = (i === curIdx ? ' on' : '') + (store[t.id] && store[t.id].done ? ' done' : '');
    html += '<div class="nav-item' + cls + '" data-i="' + i + '">' +
      '<span class="dot">' + (store[t.id] && store[t.id].done ? '✓' : '') + '</span>' +
      '<span class="id">' + t.id + '</span><span class="tt">' + t.title + '</span></div>';
  });
  nav.innerHTML = html;
  nav.querySelectorAll('.nav-item').forEach((el) => {
    el.onclick = () => openTask(+el.dataset.i);
  });
  document.getElementById('sDone').textContent = done;
}

function openTask(i) {
  curIdx = i;
  const t = TASKS[i];
  document.getElementById('taskCard').innerHTML =
    '<div class="card">' +
    '<h2>' + t.id + '　' + t.title + '</h2>' +
    '<div class="meta">' + t.stage + '</div>' +
    '<div class="scene">' + t.scene + '</div>' +
    '<div class="label">交付要求</div>' +
    '<div class="req">' + t.ask + '</div>' +
    '<div class="label">输出列（按此顺序）</div>' +
    '<div class="cols">' + t.cols.map((c) => '<code>' + c + '</code>').join('') + '</div>' +
    '<details class="hint"><summary>卡住了？点开提示</summary><p>' + t.hint + '</p></details>' +
    '</div>';
  const ta = document.getElementById('sql');
  ta.value = getDraft(i);
  document.getElementById('result').innerHTML = '';
  document.getElementById('answerBox').innerHTML = '';
  hideMsg();
  document.getElementById('rowInfo').textContent = '';
  renderNav();
  ta.focus();
  try { history.replaceState(null, '', '#' + t.id); } catch (e) {}
}

function runSql(sql) {
  return db.exec(sql);
}

function run() {
  const sql = document.getElementById('sql').value.trim();
  const k = taskKey(curIdx);
  store[k] = store[k] || {};
  store[k].sql = sql;
  save();
  if (!sql) { showMsg('info', '先写点 SQL 再运行。'); return; }
  try {
    const res = runSql(sql);
    document.getElementById('result').innerHTML = renderTable(res);
    hideMsg();
  } catch (e) {
    document.getElementById('result').innerHTML = '';
    showMsg('err', 'SQL 报错：' + e.message);
  }
}

function sameVal(a, b) {
  if (a === null || a === undefined) return b === null || b === undefined;
  if (b === null || b === undefined) return false;
  if (typeof a === 'number' && typeof b === 'number') {
    if (Math.abs(a - b) <= 0.02) return true;
    if (Math.abs(a - b) <= Math.max(Math.abs(a), Math.abs(b)) * 0.001) return true;
    return false;
  }
  return String(a).trim() === String(b).trim();
}

function check() {
  const sql = document.getElementById('sql').value.trim();
  const t = TASKS[curIdx];
  if (!sql) { showMsg('info', '先写点 SQL 再校验。'); return; }
  let mine, expect;
  try { mine = runSql(sql); } catch (e) { showMsg('err', 'SQL 报错：' + e.message); return; }
  try { expect = runSql(t.answer); } catch (e) { showMsg('err', '答案执行异常：' + e.message); return; }

  document.getElementById('result').innerHTML = renderTable(mine);

  if (!mine.length || !expect.length) {
    showMsg('err', '你的查询没有返回结果集。'); return;
  }
  const A = mine[0], B = expect[0];

  if (A.values.length !== B.values.length) {
    showMsg('err', '行数对不上：你返回 ' + A.values.length + ' 行，应为 ' + B.values.length + ' 行。\n' +
      (A.values.length > B.values.length ? '多半是没排除干扰行（重复单据 / 缺月客户 / 未过滤区域）。' : '可能漏了某些月份或分组维度。'));
    return;
  }
  if (A.columns.length !== B.columns.length) {
    showMsg('err', '列数对不上：你返回 ' + A.columns.length + ' 列，应为 ' + B.columns.length + ' 列。\n输出列：' + t.cols.join(' / '));
    return;
  }
  let badRow = -1, badCol = -1;
  for (let r = 0; r < A.values.length && badRow < 0; r++) {
    for (let c = 0; c < A.columns.length; c++) {
      if (!sameVal(A.values[r][c], B.values[r][c])) { badRow = r; badCol = c; break; }
    }
  }
  if (badRow >= 0) {
    showMsg('err', '行数对了，但值不对。第 ' + (badRow + 1) + ' 行「' + B.columns[badCol] + '」列：\n' +
      '你的结果：' + fmtCell(A.values[badRow][badCol]).replace(/<[^>]+>/g, '') + '\n' +
      '正确结果：' + fmtCell(B.values[badRow][badCol]).replace(/<[^>]+>/g, '') + '\n\n' +
      '常见原因：没去重、没处理退货负数、没 COALESCE 空折扣、日期斜杠没统一、排序不稳定导致行错位。');
    return;
  }
  showMsg('ok', '✓ 通过。这一题的结果和参考答案完全一致（' + B.values.length + ' 行）。');
  setDone(curIdx, true);
}

function showAnswer() {
  const t = TASKS[curIdx];
  document.getElementById('answerBox').innerHTML =
    '<div class="card" style="border-color:var(--hl-bd)">' +
    '<div class="label" style="margin-top:0">参考答案</div>' +
    '<pre style="margin:0;font-family:var(--mono);font-size:12.5px;line-height:1.7;color:var(--info-tx);white-space:pre-wrap">' +
    t.answer.replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c])) + '</pre></div>';
}

function renderDict() {
  document.getElementById('dict').innerHTML = DICT.map((t) =>
    '<div class="tbl-card"><header>' + t.name + '<em>' + t.note + '</em></header>' +
    '<table>' + t.cols.map((c) =>
      '<tr><td>' + c[0] + '</td><td>' + c[1] + '</td><td>' + c[2] + '</td></tr>').join('') +
    '</table></div>').join('');
}

async function boot() {
  restore();
  initTheme();
  try {
    await bootInner();
  } catch (e) {
    document.getElementById('boot').style.display = 'flex';
    document.getElementById('boot').innerHTML =
      '<div style="max-width:520px;text-align:center;line-height:1.8">' +
      '初始化失败：' + (e && e.message ? e.message : e) +
      '<br><span style="font-size:12px;color:var(--tx3)">若是网络问题，请确认能访问 cdnjs 或 jsdelivr；' +
      '若是语法问题，请按 F12 看控制台。</span></div>';
  }
}

async function bootInner() {
  let SQL = null, base = '';
  for (const src of CDN) {
    try {
      await loadScript(src.base + 'sql-wasm.js');
      SQL = await window.initSqlJs({ locateFile: (f) => src.base + f });
      base = src.base;
      break;
    } catch (e) { /* 换下一个源 */ }
  }
  if (!SQL) {
    document.getElementById('boot').innerHTML = '<div>SQL 引擎加载失败，请检查网络后刷新（需要访问 cdnjs 或 jsdelivr）。</div>';
    return;
  }

  db = new SQL.Database();
  db.run(SCHEMA);
  const data = buildData();
  insertAll(db, data);

  document.getElementById('sSales').textContent = data.sales.length.toLocaleString('zh-CN');
  document.getElementById('tabWork').onclick = () => {
    document.getElementById('viewWork').classList.remove('hidden');
    document.getElementById('viewDict').classList.add('hidden');
    document.getElementById('tabWork').classList.add('on');
    document.getElementById('tabDict').classList.remove('on');
  };
  document.getElementById('tabDict').onclick = () => {
    document.getElementById('viewDict').classList.remove('hidden');
    document.getElementById('viewWork').classList.add('hidden');
    document.getElementById('tabDict').classList.add('on');
    document.getElementById('tabWork').classList.remove('on');
  };

  document.getElementById('runBtn').onclick = run;
  document.getElementById('checkBtn').onclick = check;
  document.getElementById('ansBtn').onclick = showAnswer;
  document.getElementById('clearBtn').onclick = () => {
    document.getElementById('sql').value = '';
    document.getElementById('result').innerHTML = '';
    document.getElementById('answerBox').innerHTML = '';
    hideMsg();
  };

  const ta = document.getElementById('sql');
  ta.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); run(); }
    if (e.key === 'Tab') {
      e.preventDefault();
      const s = ta.selectionStart, en = ta.selectionEnd;
      ta.value = ta.value.slice(0, s) + '  ' + ta.value.slice(en);
      ta.selectionStart = ta.selectionEnd = s + 2;
    }
  });

  renderDict();
  renderNav();
  const h = (location.hash || '').replace('#', '').trim();
  const startIdx = TASKS.findIndex((t) => t.id === h);
  openTask(startIdx >= 0 ? startIdx : 0);
  document.getElementById('boot').style.display = 'none';
  document.getElementById('app').classList.remove('hidden');
}

boot();
</script>
</body>
</html>
