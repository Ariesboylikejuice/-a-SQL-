<style>
  :root{
    --bg:#f4f6fb; --card:#ffffff; --ink:#1f2937; --muted:#6b7280; --border:#e6e9f0;
    --primary:#2563eb; --primary-d:#1d4ed8; --accent:#0ea5e9;
    --income:#16a34a; --expense:#dc2626; --warn:#f59e0b; --ok:#16a34a;
    --shadow:0 1px 3px rgba(16,24,40,.06),0 1px 2px rgba(16,24,40,.04);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg); color:var(--ink); line-height:1.55; -webkit-text-size-adjust:100%;
  }
  a{color:var(--primary)}
  .wrap{max-width:1080px;margin:0 auto;padding:0 14px 80px}

  /* 顶栏 */
  header.topbar{
    position:sticky; top:0; z-index:30; background:linear-gradient(120deg,#1e3a8a,#2563eb 55%,#0ea5e9);
    color:#fff; padding:14px 16px; box-shadow:var(--shadow);
  }
  .topbar .row{display:flex; align-items:center; gap:12px; max-width:1080px; margin:0 auto}
  .logo{flex:0 0 auto}
  .logo-ico{width:30px;height:30px;fill:#fff}
  .ico{width:16px;height:16px;fill:currentColor;vertical-align:-3px;margin-right:6px}
  .ico-sm{width:13px;height:13px;fill:currentColor;vertical-align:-2px;margin-right:4px}
  .titlebox h1{font-size:18px; margin:0; font-weight:700; letter-spacing:.5px}
  .titlebox p{margin:2px 0 0; font-size:12px; opacity:.85}
  .topbar .spacer{flex:1}
  .sync-pill{display:inline-flex; align-items:center; gap:6px; background:rgba(255,255,255,.15); border:1px solid rgba(255,255,255,.3); padding:5px 10px; border-radius:999px; font-size:12px}
  .dot{width:8px;height:8px;border-radius:50%;background:#86efac;box-shadow:0 0 0 3px rgba(134,239,172,.3)}

  /* 今日任务 */
  .today{margin:16px 0 6px}
  .today h2{font-size:14px; margin:0 0 8px; color:var(--muted); font-weight:600; display:flex; align-items:center; gap:6px}
  .task-list{display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:10px}
  .task-card{background:var(--card); border:1px solid var(--border); border-radius:12px; padding:12px; box-shadow:var(--shadow); display:flex; flex-direction:column; gap:6px}
  .task-no{font-size:11px; color:var(--accent); font-weight:700}
  .task-title{font-size:14px; font-weight:600}
  .task-desc{font-size:12px; color:var(--muted); min-height:32px}
  .btn{appearance:none; border:none; border-radius:9px; cursor:pointer; font-size:13px; padding:9px 12px; font-weight:600; transition:.15s}
  .btn-run{background:var(--primary); color:#fff; margin-top:auto}
  .btn-run:hover{background:var(--primary-d)}

  /* Tabs */
  .tabs{display:flex; gap:8px; margin:18px 0 12px; flex-wrap:wrap}
  .tab-btn{flex:1; min-width:96px; background:var(--card); border:1px solid var(--border); color:var(--muted); border-radius:10px; padding:10px 8px; font-size:14px; font-weight:600; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:6px}
  .tab-btn.active{background:var(--primary); color:#fff; border-color:var(--primary)}
  .tab-pane{display:none}
  .tab-pane.active{display:block}

  /* 通用卡片 */
  .card{background:var(--card); border:1px solid var(--border); border-radius:14px; padding:14px; box-shadow:var(--shadow); margin-bottom:14px}
  .card h3{margin:0 0 10px; font-size:15px; display:flex; align-items:center; gap:8px}
  .muted{color:var(--muted); font-size:12px}

  .chip.active{background:var(--primary); color:#fff; border-color:var(--primary)}

  /* schema */

  .schema-grid{display:flex; flex-wrap:wrap; gap:6px}
  .schema-col{background:#f1f5f9; border:1px solid #e2e8f0; border-radius:8px; padding:5px 9px; font-size:12px}
  .sc-name{font-weight:600; margin-right:6px}
  .sc-type{color:var(--muted); font-size:11px}
  .rel-note{margin-top:10px; font-size:12px; color:var(--primary-d); background:#eff6ff; border:1px solid #dbeafe; border-radius:8px; padding:8px 10px}
  .more-note,.hint{font-size:12px; color:var(--muted); margin-top:8px}

  /* 表格 */

  td.dir-贷{color:var(--income)}

  /* 沙盒 */
  .toolbar{display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:10px}
  select,textarea,input[type=text]{
    font-family:inherit; border:1px solid var(--border); border-radius:9px; padding:9px 10px; font-size:14px; background:#fff; color:var(--ink);
  }
  textarea#sqlInput{width:100%; min-height:150px; resize:vertical; font-family:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace; font-size:13.5px; line-height:1.5; tab-size:2}
  .btn-primary{background:var(--primary); color:#fff}
  .btn-primary:hover{background:var(--primary-d)}
  .btn-ghost{background:#fff; border:1px solid var(--border); color:var(--ink)}

  .btn-mini.danger{background:#fef2f2; border-color:#fecaca; color:#b91c1c}
  #resultArea{min-height:120px; margin-top:10px}
  .result-meta{font-size:12px; color:var(--muted); margin:8px 2px}
  .err-msg{background:#fef2f2; border:1px solid #fecaca; color:#b91c1c; border-radius:10px; padding:12px; font-size:13px}
  .err-hint{margin-top:8px; font-size:12px; color:#7f1d1d; opacity:.85}
  .ok-msg{background:#ecfdf5; border:1px solid #a7f3d0; color:#047857; border-radius:10px; padding:12px; font-size:13px}
  .hint{color:var(--muted)}

  /* 保存的查询 */
  .saved-item{border:1px solid var(--border); border-radius:10px; padding:10px; margin-bottom:8px}
  .saved-name{font-weight:700; font-size:13px}
  .saved-sql{font-family:monospace; font-size:11.5px; color:var(--muted); background:#f8fafc; border-radius:6px; padding:6px; margin:6px 0; white-space:pre-wrap; word-break:break-all}
  .saved-actions{display:flex; gap:6px}
  .saved-empty{font-size:12px; color:var(--muted)}

  /* 语法速查 */
  .ref-group{border:1px solid var(--border); border-radius:12px; margin-bottom:10px; overflow:hidden; background:#fff}
  .ref-head{width:100%; text-align:left; background:#f8fafc; border:none; padding:13px 14px; font-size:14px; font-weight:700; cursor:pointer; display:flex; justify-content:space-between; align-items:center; color:#334155}
  .ref-head .arrow{transition:.2s; color:var(--muted)}
  .ref-group.open .ref-head .arrow{transform:rotate(180deg)}
  .ref-body{display:none; padding:6px 14px 12px}
  .ref-group.open .ref-body{display:block}
  .ref-item{border-top:1px dashed #eef0f5; padding:10px 0}
  .ref-desc{font-size:13px; font-weight:600; margin-bottom:6px}
  pre.ref-sql{background:#0f172a; color:#e2e8f0; border-radius:8px; padding:10px 12px; font-size:12.5px; overflow:auto; white-space:pre-wrap; word-break:break-all; margin:0 0 8px; cursor:pointer; font-family:"SFMono-Regular",Consolas,Menlo,monospace}
  pre.ref-sql:hover{outline:2px solid var(--accent)}

  /* toast */
  #toast{position:fixed; left:50%; bottom:28px; transform:translateX(-50%) translateY(20px); background:#111827; color:#fff; padding:10px 18px; border-radius:10px; font-size:13px; opacity:0; pointer-events:none; transition:.25s; z-index:50}
  #toast.show{opacity:.95; transform:translateX(-50%) translateY(0)}

  footer{text-align:center; color:var(--muted); font-size:12px; margin-top:24px}
  footer .badge{display:inline-block; background:#eef2ff; border:1px solid #dbe3ff; color:#334155; border-radius:999px; padding:3px 10px; margin:0 3px}

  @media (max-width:768px){
    .topbar .row{padding:0}
    .titlebox h1{font-size:16px}
    .task-list{grid-template-columns:1fr 1fr}
    .tabs{gap:6px}
    .tab-btn{font-size:13px; padding:9px 4px; min-width:0}
    textarea#sqlInput{min-height:130px}
    .toolbar .btn,.toolbar select{flex:1 1 auto}
  }
  @media (max-width:480px){
    .task-list{grid-template-columns:1fr}
    .sync-pill{display:none}
  }
</style>

<!-- 引擎（占位，构建时注入） -->
<script>/* =========================================================================
 * 小a SQL语法练习平台 —— 纯 JS 浏览器内 SQL 引擎 + 虚拟财务数据
 * 零外部依赖。支持：SELECT / WHERE / GROUP BY / HAVING / ORDER BY / LIMIT /
 * JOIN(INNER/LEFT/RIGHT) / 聚合函数 / 常用标量函数 / INSERT / UPDATE /
 * DELETE / CREATE TABLE / DROP TABLE / DISTINCT / LIKE / IN / BETWEEN / IS NULL
 * ========================================================================= */

/* ---------- 虚拟财务数据（确定性生成，刷新后一致） ---------- */
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function buildDB() {
  const rng = mulberry32(20260827);
  const rand = (a, b) => a + Math.floor(rng() * (b - a + 1));
  const pick = (arr) => arr[Math.floor(rng() * arr.length)];

  const departments = [
    { dept_id: 1, dept_name: '销售一部', region: '华东' },
    { dept_id: 2, dept_name: '销售二部', region: '华北' },
    { dept_id: 3, dept_name: '市场部', region: '华南' },
    { dept_id: 4, dept_name: '财务部', region: '华东' },
    { dept_id: 5, dept_name: '行政人事部', region: '西南' },
  ];

  const accounts = [
    { acc_code: '1001', acc_name: '库存现金', acc_type: '资产' },
    { acc_code: '1122', acc_name: '应收账款', acc_type: '资产' },
    { acc_code: '2202', acc_name: '应付账款', acc_type: '负债' },
    { acc_code: '2221', acc_name: '应交税费', acc_type: '负债' },
    { acc_code: '3001', acc_name: '实收资本', acc_type: '权益' },
    { acc_code: '6001', acc_name: '主营业务收入', acc_type: '收入' },
    { acc_code: '6051', acc_name: '其他业务收入', acc_type: '收入' },
    { acc_code: '6401', acc_name: '主营业务成本', acc_type: '费用' },
    { acc_code: '6601', acc_name: '销售费用', acc_type: '费用' },
    { acc_code: '6602', acc_name: '管理费用', acc_type: '费用' },
    { acc_code: '6603', acc_name: '财务费用', acc_type: '费用' },
  ];

  const customers = [
    { cust_id: 1, cust_name: '北京智联科技有限公司', region: '华北', level: 'A' },
    { cust_id: 2, cust_name: '上海远见贸易有限公司', region: '华东', level: 'A' },
    { cust_id: 3, cust_name: '广州海纳实业', region: '华南', level: 'B' },
    { cust_id: 4, cust_name: '深圳锐进电子', region: '华南', level: 'A' },
    { cust_id: 5, cust_name: '杭州云栖网络', region: '华东', level: 'B' },
    { cust_id: 6, cust_name: '成都天府软件', region: '西南', level: 'C' },
  ];

  const vouchers = [];
  let vid = 1000;
  const summaries = {
    '6001': ['产品销售收入', '销售回款-收入确认', '季度服务收入'],
    '6051': ['废料处置收入', '租金收入', '咨询服务收入'],
    '6401': ['采购原材料成本', '直接人工成本', '制造费用结转'],
    '6601': ['销售人员差旅费', '市场推广费', '业务招待费', '销售提成'],
    '6602': ['办公费', '管理人员工资', '房租水电', '折旧摊销'],
    '6603': ['银行手续费', '汇兑损益', '借款利息'],
    '1122': ['赊销应收账款', '收回客户欠款'],
    '2202': ['采购应付账款', '支付供应商货款'],
    '2221': ['计提增值税', '缴纳附加税'],
    '1001': ['现金收款', '现金付款', '备用金支取'],
    '3001': ['股东注资', '资本公积转入'],
  };

  for (let m = 1; m <= 12; m++) {
    const mm = String(m).padStart(2, '0');
    for (const d of departments) {
      // 收入（主营业务收入 + 少量其他业务收入）
      const baseRev = (d.dept_id === 1 || d.dept_id === 2) ? rand(120000, 260000)
        : (d.dept_id === 3) ? rand(60000, 120000)
          : rand(20000, 60000);
      const rev = baseRev - (baseRev % 100);
      vouchers.push({ vid: ++vid, date: `2025-${mm}-${rand(1, 27).toString().padStart(2, '0')}`, dept_id: d.dept_id, acc_code: '6001', direction: '贷', amount: rev, cust_id: pick(customers).cust_id, summary: pick(summaries['6001']) });
      // 应收账款：部分赊销
      if (rng() > 0.5) {

    ['budgets', budgets],

    db[name] = { cols: Object.keys(rows[0]), rows };
  }

}

    case 'func': return callFunc(node.name, node.args.map((a) => evalExpr(a, row, groupRows)));
    case 'agg':
      return evalAgg(node, groupRows);
  }
  throw new Error('无法求值的表达式节点');
}
function evalAgg(node, groupRows) {
  if (node.fn === 'COUNT') {
    if (node.arg === '*') return groupRows.length;
    let cnt = 0;
    const seen = new Set();
    for (const r of groupRows) {
      const v = evalExpr(node.arg, r, groupRows);
      if (v !== null && v !== undefined) {
        if (node.distinct) { const k = JSON.stringify(v); if (seen.has(k)) continue; seen.add(k); }
        cnt++;
      }
    }
    return cnt;
  }
  const vals = [];
  const seen = new Set();
  for (const r of groupRows) {
    const v = evalExpr(node.arg, r, groupRows);
    if (v !== null && v !== undefined) {
      if (node.distinct) { const k = JSON.stringify(v); if (seen.has(k)) continue; seen.add(k); }
      vals.push(v);
    }
  }
  const nums = vals.map(toNum);
  switch (node.fn) {
    case 'SUM': return nums.reduce((a, b) => a + b, 0);
    case 'AVG': return nums.length ? nums.reduce((a, b) => a + b, 0) / nums.length : null;
    case 'MIN': return vals.length ? (typeof vals[0] === 'number' ? Math.min(...nums) : Math.min(...vals.map(String))) : null;
    case 'MAX': return vals.length ? (typeof vals[0] === 'number' ? Math.max(...nums) : Math.max(...vals.map(String))) : null;
  }
  throw new Error('不支持的聚合函数 ' + node.fn);
}

/* ---------- 执行 ---------- */
function loadTable(ref, db) {
  const key = Object.keys(db).find((k) => k.toLowerCase() === ref.name.toLowerCase());
  if (!key) throw new Error('表不存在：' + ref.name);
  const t = db[key];
  const alias = (ref.alias || ref.name).toLowerCase();
  const out = [];
  for (const src of t.rows) {
    const row = {};
    for (const c of t.cols) {
      row[c] = src[c];
      row[alias + '.' + c] = src[c];
    }
    out.push(row);
  }
  return { rows: out, alias, tableName: key };
}

function buildJoinedRow(leftRow, rightMeta, rightSrc, joinType, matched) {
  const row = Object.assign({}, leftRow);
  const alias = rightMeta.alias;
  for (const c of rightMeta.cols) {
    if (matched) {
      row[c] = rightSrc[c];
      row[alias + '.' + c] = rightSrc[c];
    } else {
      row[c] = null;
      row[alias + '.' + c] = null;
    }
  }
  return row;
}

function executeSelect(ast, db) {
  const fromMeta = loadTable(ast.from, db);
  let rows = fromMeta.rows;

  for (const j of ast.joins) {
    const rightMetaRaw = loadTable(j.table, db);
    const rightMeta = { alias: (j.table.alias || j.table.name).toLowerCase(), cols: db[Object.keys(db).find((k) => k.toLowerCase() === j.table.name.toLowerCase())].cols, tableName: rightMetaRaw.tableName };
    const newRows = [];
    for (const lr of rows) {
      let matchedAny = false;
      for (const rr of rightMetaRaw.rows) {
        const combined = buildJoinedRow(lr, rightMeta, rr, j.type, true);
        if (truthy(evalExpr(j.on, combined, [combined]))) { newRows.push(combined); matchedAny = true; }
      }
      if (!matchedAny && (j.type === 'LEFT')) {
        newRows.push(buildJoinedRow(lr, rightMeta, {}, 'LEFT', false));
      }
      if (!matchedAny && (j.type === 'RIGHT')) {
        // RIGHT: 输出右表所有行，左表为 null
        for (const rr of rightMetaRaw.rows) {
          const combined = buildJoinedRow({}, rightMeta, rr, 'RIGHT', true);
          if (truthy(evalExpr(j.on, combined, [combined]))) newRows.push(combined);
        }
      }
    }
    rows = newRows;
  }

  if (ast.where) rows = rows.filter((r) => truthy(evalExpr(ast.where, r, [r])));

  const hasAgg = ast.items.some((it) => it.type === 'expr' && containsAgg(it.expr)) || ast.items.some((it) => it.type === 'star' && false);
  const grouping = ast.groupBy.length > 0;
  const needGroup = grouping || hasAgg;

  // 投影：确定每列的 outKey 与表头
  const columns = []; // {key, header}
  const headerCount = {};
  function registerHeader(h) { headerCount[h] = (headerCount[h] || 0) + 1; }
  function expandStar() {
    if (ast.joins.length === 0) {
      const t = db[fromMeta.tableName];
      for (const c of t.cols) {
        if (headerCount[c]) continue;
        columns.push({ key: c, header: c, expr: { type: 'col', name: c } });
        registerHeader(c);
      }
    } else {
      const sample = rows[0] || lastJoinedRow(ast, db);
      if (!sample) return;
      for (const k of Object.keys(sample)) {
        if (!k.includes('.')) continue;
        const bare = k.split('.').pop();
        const header = headerCount[bare] ? k : bare;
        columns.push({ key: k, header, expr: { type: 'col', name: k } });
        registerHeader(header);
      }
    }
  }
  for (const it of ast.items) {
    if (it.type === 'star') { expandStar(); continue; }
    let header = it.alias || exprText(it.expr);
    // 去掉可能重复
    while (headerCount[header]) header = header + '_';
    registerHeader(header);
    columns.push({ key: header, header, expr: it.expr });
  }

  // 生成中间结果（含 group 引用用于 HAVING）
  let inter = [];
  if (needGroup) {
    if (grouping) {
      const groups = new Map();
      for (const r of rows) {
        const key = ast.groupBy.map((g) => JSON.stringify(evalExpr(g, r, [r]))).join('\u0001');
        if (!groups.has(key)) groups.set(key, []);
        groups.get(key).push(r);
      }
      for (const grp of groups.values()) {
        inter.push(projectRow(grp[0], grp));
      }
    } else {
      inter.push(projectRow(rows[0] || {}, rows));
    }
  } else {
    for (const r of rows) inter.push(projectRow(r, [r]));
  }

  function projectRow(rep, grp) {
    const data = {};
    for (const col of columns) {
      if (col.expr) data[col.key] = evalExpr(col.expr, rep, grp);
    }
    return { data, group: grp };
  }

  if (ast.having) inter = inter.filter((it) => truthy(evalExpr(ast.having, Object.assign({}, it.group[0], it.data), it.group)));

  if (ast.orderBy.length) {
    inter.sort((a, b) => {
      for (const o of ast.orderBy) {
        const va = evalExpr(o.expr, a.data, a.group);
        const vb = evalExpr(o.expr, b.data, b.group);
        let cmp;
        if (typeof va === 'number' && typeof vb === 'number') cmp = va - vb;
        else cmp = String(va == null ? '' : va) < String(vb == null ? '' : vb) ? -1 : String(va == null ? '' : va) > String(vb == null ? '' : vb) ? 1 : 0;
        if (cmp !== 0) return o.dir === 'DESC' ? -cmp : cmp;
      }
      return 0;
    });
  }

  if (ast.distinct) {
    const seen = new Set();
    inter = inter.filter((it) => {
      const sig = JSON.stringify(columns.map((c) => it.data[c.key]));
      if (seen.has(sig)) return false; seen.add(sig); return true;
    });
  }

  if (ast.limit != null) inter = inter.slice(ast.offset, ast.offset + ast.limit);

  const outRows = inter.map((it) => columns.map((c) => it.data[c.key]));
  return { columns: columns.map((c) => c.header), rows: outRows, rowCount: outRows.length };
}

function lastJoinedRow(ast, db) {
  // 当结果为空且含 * 时用于推断列
  const fromMeta = loadTable(ast.from, db);
  let sample = Object.assign({}, fromMeta.rows[0] || {});
  for (const j of ast.joins) {
    const rt = db[Object.keys(db).find((k) => k.toLowerCase() === j.table.name.toLowerCase())];
    const ra = (j.table.alias || j.table.name).toLowerCase();
    const r0 = rt.rows[0] || {};
    for (const c of rt.cols) { sample[c] = null; sample[ra + '.' + c] = null; }
  }
  return sample;
}

function containsAgg(node) {
  if (!node) return false;
  if (node.type === 'agg') return true;
  if (node.type === 'bin') return containsAgg(node.left) || containsAgg(node.right) || (node.low && containsAgg(node.low)) || (node.high && containsAgg(node.high));
  if (node.type === 'unary') return containsAgg(node.expr);
  if (node.type === 'func') return node.args.some((a) => containsAgg(a));
  return false;
}

function exprText(node) {
  if (node.type === 'col') return node.name;
  if (node.type === 'lit') return node.value == null ? 'NULL' : (typeof node.value === 'number' ? String(node.value) : "'" + node.value + "'");
  if (node.type === 'agg') return node.fn + '(' + (node.arg === '*' ? '*' : exprText(node.arg)) + ')';
  if (node.type === 'func') return node.name + '(' + node.args.map((a) => exprText(a.expr !== undefined ? a.expr : a)).join(', ') + ')';
  if (node.type === 'unary') return node.op + exprText(node.expr);
  if (node.type === 'bin') {
    if (node.op === 'ISNULL') return exprText(node.left) + (node.isNull ? ' IS NULL' : ' IS NOT NULL');
    if (node.op === 'LIKE') return exprText(node.left) + ' LIKE ' + exprText(node.right);
    if (node.op === 'IN') return exprText(node.left) + ' IN (' + node.list.map((v) => exprText(v)).join(', ') + ')';
    if (node.op === 'BETWEEN') return exprText(node.left) + ' BETWEEN ' + exprText(node.low) + ' AND ' + exprText(node.high);
    return exprText(node.left) + ' ' + node.op + ' ' + exprText(node.right);
  }
  return '?';
}

function executeDML(ast, db) {
  if (ast.kind === 'create') {
    if (db[ast.table]) throw new Error('表已存在：' + ast.table);
    db[ast.table] = { cols: ast.cols, rows: [] };
    return { columns: ['操作'], rows: [['CREATE TABLE']], rowCount: 0, message: `已创建表 ${ast.table}` };
  }
  if (ast.kind === 'drop') {
    if (!db[ast.table]) throw new Error('表不存在：' + ast.table);
    delete db[ast.table];
    return { columns: ['操作'], rows: [['DROP TABLE']], rowCount: 0, message: `已删除表 ${ast.table}` };
  }
  const key = Object.keys(db).find((k) => k.toLowerCase() === ast.table.toLowerCase());
  if (!key) throw new Error('表不存在：' + ast.table);
  const t = db[key];
  if (ast.kind === 'insert') {
    let affected = 0;
    for (const vals of ast.rows) {
      if (ast.cols.length !== vals.length) throw new Error('列数与值数量不一致');
      const row = {};
      for (let i = 0; i < t.cols.length; i++) row[t.cols[i]] = null;
      ast.cols.forEach((c, i) => { row[c] = vals[i].value; });
      // 自动补 id
      const idCol = t.cols.find((c) => /id$/i.test(c));
      if (idCol && (row[idCol] === null || row[idCol] === undefined)) {
        const maxId = t.rows.reduce((m, r) => Math.max(m, Number(r[idCol]) || 0), 0);
        row[idCol] = maxId + 1;
      }
      t.rows.push(row);
      affected++;
    }
    return { columns: [], rows: [], rowCount: affected, message: `已插入 ${affected} 行` };
  }
  if (ast.kind === 'update' || ast.kind === 'delete') {
    let affected = 0;
    for (const r of t.rows) {
      const hit = ast.where ? truthy(evalExpr(ast.where, r, [r])) : true;
      if (!hit) continue;
      if (ast.kind === 'update') { for (const s of ast.sets) r[s.col] = s.val.value; }
      else { r.__deleted = true; }
      affected++;
    }
    if (ast.kind === 'delete') t.rows = t.rows.filter((r) => !r.__deleted);
    const op = ast.kind === 'update' ? 'UPDATE' : 'DELETE';
    return { columns: [], rows: [], rowCount: affected, message: `已${ast.kind === 'update' ? '更新' : '删除'} ${affected} 行` };
  }
}

function runSQL(sql, db) {
  const ast = parse(sql);
  if (ast.kind === 'select') return executeSelect(ast, db);
  return executeDML(ast, db);
}

      const cells = $all('th,td', tr).map((c) => {
        let v = c.textContent;
        if (/[",\n]/.test(v)) v = '"' + v.replace(/"/g, '""') + '"';
        return v;
      });
      lines.push(cells.join(','));
    });
    const csv = '﻿' + lines.join('\n');
    download(csv, 'sql_result.csv', 'text/csv;charset=utf-8');
  }
  function download(content, fname, mime) {
    const blob = new Blob([content], { type: mime });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = fname;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }

  /* ---------- 保存的查询 ---------- */
  function loadQueries() {
    try { return JSON.parse(localStorage.getItem(LS_Q) || '[]'); } catch (e) { return []; }
  }
  function saveQueries(q) { localStorage.setItem(LS_Q, JSON.stringify(q)); }
  function renderSaved() {
    const box = $('#savedList');
    const q = loadQueries();
    if (!q.length) { box.innerHTML = '<div class="saved-empty">还没有保存的查询。写好 SQL 后点“保存查询”即可收藏。</div>'; return; }
    box.innerHTML = '';
    q.forEach((item, i) => {
      const d = document.createElement('div');
      d.className = 'saved-item';
      d.innerHTML = `<div class="saved-name">${esc(item.name)}</div><div class="saved-sql">${esc(item.sql)}</div>` +
        `<div class="saved-actions"><button class="btn-mini" data-act="load" data-i="${i}">载入</button><button class="btn-mini danger" data-act="del" data-i="${i}">删除</button></div>`;
      box.appendChild(d);
    });
    $all('button', box).forEach((b) => {
      b.addEventListener('click', () => {
        const i = +b.dataset.i;
        const q = loadQueries();
        if (b.dataset.act === 'load') { $('#sqlInput').value = q[i].sql; switchTab('sandbox'); toast('已载入查询'); }
        else { q.splice(i, 1); saveQueries(q); renderSaved(); }
      });
    });
  }
  function saveCurrentQuery() {
    const sql = $('#sqlInput').value.trim();
    if (!sql) { toast('没有可保存的 SQL'); return; }
    const name = prompt('给这条查询起个名字：', sql.slice(0, 20));
    if (!name) return;
    const q = loadQueries();
    q.unshift({ name, sql });
    saveQueries(q);
    renderSaved();
    toast('已保存查询');
  }

  /* ---------- 备份导入导出 ---------- */
  function exportBackup() {
    const payload = { tables: DB, queries: loadQueries() };
    download('﻿' + JSON.stringify(payload, null, 2), 'sqlfin_backup.json', 'application/json');
  }
  function importBackup() {
    const inp = document.createElement('input');
    inp.type = 'file'; inp.accept = '.json';
    inp.onchange = () => {
      const f = inp.files[0]; if (!f) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const data = JSON.parse(reader.result);
          if (!data.tables) throw new Error('文件格式不正确');
          DB = data.tables;
          if (data.queries) saveQueries(data.queries);
          saveDB();
          renderTableList();
          showTable(currentTable);
          renderSaved();
          toast('备份已恢复');
        } catch (e) { alert('导入失败：' + e.message); }
      };
      reader.readAsText(f);
    };
    inp.click();
  }

  /* ---------- 语法速查 ---------- */
  const REF = [
    { cat: 'SELECT 基础查询', items: [
      { d: '查询表中所有列', s: 'SELECT * FROM departments;' },
      { d: '查询指定列', s: 'SELECT dept_name, region FROM departments;' },
      { d: '给列起别名（AS 可省略）', s: "SELECT dept_name AS 部门, region 区域 FROM departments;" },
      { d: '查询不重复的组合（DISTINCT）', s: 'SELECT DISTINCT acc_code FROM vouchers;' },
    ]},
    { cat: 'WHERE 条件过滤', items: [
      { d: '等于 / 不等于', s: "SELECT * FROM vouchers WHERE direction = '借';" },
      { d: '数值比较（大于）', s: 'SELECT * FROM vouchers WHERE amount > 50000;' },
      { d: '逻辑 AND / OR', s: "SELECT * FROM vouchers WHERE dept_id = 1 AND direction = '借';" },
      { d: 'IN 列表匹配', s: 'SELECT * FROM vouchers WHERE dept_id IN (1, 2, 3);' },
      { d: 'BETWEEN 区间', s: 'SELECT * FROM vouchers WHERE amount BETWEEN 30000 AND 60000;' },
      { d: 'IS NULL / IS NOT NULL', s: 'SELECT * FROM vouchers WHERE cust_id IS NULL LIMIT 10;' },
      { d: 'LIKE 模糊匹配（% 任意，_ 单字）', s: "SELECT * FROM vouchers WHERE summary LIKE '%应收%' LIMIT 10;" },
    ]},
    { cat: '排序与分页', items: [
      { d: 'ORDER BY 升序 / 降序', s: 'SELECT * FROM vouchers ORDER BY amount DESC LIMIT 10;' },
      { d: '多列排序', s: 'SELECT dept_id, amount FROM vouchers ORDER BY dept_id ASC, amount DESC LIMIT 20;' },
      { d: 'LIMIT 限制返回行数', s: 'SELECT * FROM vouchers LIMIT 5;' },
    ]},
    { cat: '聚合函数', items: [
      { d: 'COUNT 计数', s: 'SELECT COUNT(*) AS 总笔数 FROM vouchers;' },
      { d: 'SUM 求和', s: "SELECT SUM(amount) AS 总借方 FROM vouchers WHERE direction = '借';" },
      { d: 'AVG / MIN / MAX', s: "SELECT AVG(amount) AS 平均, MIN(amount) AS 最小, MAX(amount) AS 最大 FROM vouchers WHERE direction = '借';" },
    ]},
    { cat: 'GROUP BY 与 HAVING', items: [
      { d: '按科目分组汇总', s: 'SELECT acc_code, SUM(amount) AS 合计 FROM vouchers GROUP BY acc_code ORDER BY 合计 DESC;' },
      { d: '多列分组', s: 'SELECT dept_id, direction, SUM(amount) AS 合计 FROM vouchers GROUP BY dept_id, direction ORDER BY dept_id;' },
      { d: 'HAVING 过滤分组结果', s: 'SELECT dept_id, COUNT(*) AS 笔数 FROM vouchers GROUP BY dept_id HAVING COUNT(*) > 100;' },
      { d: 'HAVING 用聚合别名', s: 'SELECT acc_code, SUM(amount) AS 合计 FROM vouchers GROUP BY acc_code HAVING 合计 > 1000000;' },
    ]},
    { cat: '多表连接 JOIN', items: [
      { d: 'INNER JOIN 内连接', s: "SELECT d.dept_name, v.amount FROM vouchers v JOIN departments d ON v.dept_id = d.dept_id LIMIT 10;" },
      { d: 'LEFT JOIN 左连接', s: "SELECT d.dept_name, SUM(v.amount) AS 费用 FROM vouchers v LEFT JOIN departments d ON v.dept_id = d.dept_id GROUP BY d.dept_name;" },
      { d: '三表连接（凭证+部门+客户）', s: "SELECT c.cust_name, SUM(v.amount) AS 应收 FROM vouchers v JOIN customers c ON v.cust_id = c.cust_id WHERE v.acc_code = '1122' GROUP BY c.cust_name;" },
      { d: '连接预算与实际（预算执行率基础）', s: "SELECT d.dept_name, b.month, SUM(b.budget_amount) AS 预算 FROM budgets b JOIN departments d ON b.dept_id = d.dept_id WHERE b.acc_code = '6601' GROUP BY d.dept_name, b.month LIMIT 12;" },
    ]},
    { cat: '常用函数', items: [
      { d: 'YEAR / MONTH 提取年月', s: "SELECT YEAR(date) AS 年, MONTH(date) AS 月, SUM(amount) AS 收入 FROM vouchers WHERE acc_code = '6001' GROUP BY YEAR(date), MONTH(date);" },
      { d: 'ROUND 四舍五入', s: 'SELECT ROUND(AVG(amount), 2) AS 平均金额 FROM vouchers;' },
      { d: 'COALESCE 处理空值', s: "SELECT vid, COALESCE(cust_id, '无客户') AS 客户 FROM vouchers LIMIT 10;" },
      { d: 'UPPER / LOWER 大小写', s: 'SELECT UPPER(acc_name) FROM accounts LIMIT 5;' },
      { d: 'CONCAT 拼接', s: "SELECT CONCAT(dept_name, '-', region) AS 部门地区 FROM departments;" },
    ]},
    { cat: '数据操作 DML', items: [
      { d: 'INSERT 插入一行', s: "INSERT INTO vouchers (vid, date, dept_id, acc_code, direction, amount, cust_id, summary) VALUES (9999, '2025-06-15', 1, '6601', '借', 8888, NULL, '练习插入');" },
      { d: 'INSERT 多行', s: "INSERT INTO vouchers (vid, date, dept_id, acc_code, direction, amount, cust_id, summary) VALUES (9001, '2025-07-01', 2, '6602', '借', 1000, NULL, 'A'), (9002, '2025-07-02', 2, '6602', '借', 2000, NULL, 'B');" },
      { d: 'UPDATE 更新', s: "UPDATE vouchers SET amount = 9999 WHERE vid = 9999;" },
      { d: 'DELETE 删除', s: 'DELETE FROM vouchers WHERE vid = 9999;' },
    ]},
    { cat: '表定义 DDL', items: [
      { d: 'CREATE TABLE 建表', s: 'CREATE TABLE my_practice (id INT, 项目 TEXT, 金额 NUMERIC);' },
      { d: 'DROP TABLE 删表', s: 'DROP TABLE my_practice;' },
      { d: '常见数据类型', s: '-- INT 整数 / NUMERIC 数值 / TEXT 文本 / DATE 日期 / VARCHAR(50) 变长文本' },
    ]},
    { cat: '本练习台的限制（已知边界）', items: [
      { d: '不支持的子查询', s: '-- 形如 (SELECT ...) 的子查询暂不支持，请用 JOIN 改写' },
      { d: '窗口函数 / CTE', s: '-- ROW_NUMBER()、WITH 等高级语法暂不支持' },
      { d: '建议练习路径', s: '-- 先练 SELECT+WHERE，再练 GROUP BY，最后练 JOIN 与预算分析' },
    ]},
  ];

  function renderRef() {
    const box = $('#refList');
    box.innerHTML = '';
    REF.forEach((group, gi) => {
      const sec = document.createElement('div');
      sec.className = 'ref-group';
      const head = document.createElement('button');
      head.className = 'ref-head';
      head.innerHTML = `<span>${esc(group.cat)}</span><span class="arrow">▾</span>`;
      const body = document.createElement('div');
      body.className = 'ref-body';
      group.items.forEach((it) => {
        const item = document.createElement('div');
        item.className = 'ref-item';
        item.innerHTML = `<div class="ref-desc">${esc(it.d)}</div>` +
          `<pre class="ref-sql" title="点击载入到沙盒">${esc(it.s)}</pre>` +
          `<button class="btn-mini" data-sql="${esc(it.s)}">载入沙盒</button>`;
        body.appendChild(item);
      });
      head.addEventListener('click', () => {
        sec.classList.toggle('open');
      });
      head.addEventListener('click', () => { /* toggle arrow */ });
      sec.appendChild(head); sec.appendChild(body);
      box.appendChild(sec);
    });
    // 默认展开前两组
    $all('.ref-group', box).slice(0, 2).forEach((g) => g.classList.add('open'));
    $all('.ref-sql', box).forEach((pre) => {
      pre.addEventListener('click', () => {
        const sql = pre.textContent.replace(/^--.*\n?/gm, '').trim();
        if (!sql) return;
        $('#sqlInput').value = sql;
        switchTab('sandbox');
        runSQLcmd();
      });
    });
    $all('button.btn-mini[data-sql]', box).forEach((b) => {
      b.addEventListener('click', () => {
        const sql = b.dataset.sql.replace(/^--.*\n?/gm, '').trim();
        if (!sql) return;
        $('#sqlInput').value = sql;
        switchTab('sandbox');
        runSQLcmd();
      });
    });
  }

  /* ---------- Tab 切换 ---------- */
  function switchTab(name) {
    $all('.tab-btn').forEach((b) => b.classList.toggle('active', b.dataset.tab === name));
    $all('.tab-pane').forEach((p) => p.classList.toggle('active', p.id === 'pane-' + name));
  }

  /* ---------- 初始化 ---------- */
  function init() {
    DB = loadDB() || buildDB();
    saveDB();

    renderTasks();
    renderTableList();
    showTable(currentTable);
    renderSaved();
    renderRef();

    // 示例下拉
    const exSel = $('#exampleSel');
    EXAMPLES.forEach((e, i) => {
      const o = document.createElement('option');
      o.value = i; o.textContent = e.label;
      exSel.appendChild(o);
    });
    exSel.addEventListener('change', () => {
      if (exSel.value === '') return;
      $('#sqlInput').value = EXAMPLES[+exSel.value].sql;
      switchTab('sandbox');
      runSQLcmd();
      exSel.value = '';
    });

    // 按钮事件
    $('#runBtn').addEventListener('click', runSQLcmd);
    $('#clearBtn').addEventListener('click', () => { $('#sqlInput').value = ''; $('#resultArea').innerHTML = '<div class="hint">结果将显示在这里。</div>'; $('#sqlInput').focus(); });
    $('#csvBtn').addEventListener('click', exportCSV);
    $('#saveQBtn').addEventListener('click', saveCurrentQuery);
    $('#backupBtn').addEventListener('click', exportBackup);
    $('#importBtn').addEventListener('click', importBackup);
    $('#resetBtn').addEventListener('click', () => {
      if (confirm('确定要重置为初始虚拟财务数据吗？你做的 INSERT/UPDATE/DELETE 与自建表将被清空。')) resetDB();
    });
    $('#refreshDataBtn').addEventListener('click', () => { renderTableList(); showTable(currentTable); toast('已刷新数据视图'); });

    $all('.tab-btn').forEach((b) => b.addEventListener('click', () => switchTab(b.dataset.tab)));

    // 快捷键 Ctrl/Cmd + Enter 运行
    $('#sqlInput').addEventListener('keydown', (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); runSQLcmd(); }
    });

    // 预置一条欢迎查询
    $('#sqlInput').value = "SELECT d.dept_name AS 部门, SUM(v.amount) AS 销售费用 FROM vouchers v JOIN departments d ON v.dept_id = d.dept_id WHERE v.acc_code = '6601' GROUP BY d.dept_name ORDER BY 销售费用 DESC;";
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();
</script>
