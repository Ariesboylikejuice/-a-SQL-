<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>45 天 SQL 学习计划 · 财务实例版</title>
<style>
  :root{
    --bg:#0e1116; --panel:#151a21; --panel2:#1b222b; --line:#252d38;
    --tx:#e4e8ee; --tx2:#9aa5b4; --tx3:#7c8794;
    --accent:#3d9df6; --ok:#3ec98a; --warn:#e5a23c; --err:#f06a6a;
    --mono:'SF Mono','JetBrains Mono',Consolas,monospace;

    --code-bg:#0b0e13; --code-hl:#9ecbf5;
    --td-tx:#c8d2de; --td-tx2:#a8b3c1; --row-line:#1a2029;
    --btn2:#222a35; --btn2-bd:#3a4654;
    --learn-bd:#2f3d4f;
    --ok-bg:rgba(62,201,138,.15); --ok-bd:rgba(62,201,138,.55);
    --info-bg:rgba(61,157,246,.10); --info-bd:rgba(61,157,246,.35);
  }
  /* 亮色主题 */
  html[data-theme="light"]{
    --bg:#f4f6f9; --panel:#ffffff; --panel2:#eef2f7; --line:#dbe2ea;
    --tx:#1a2230; --tx2:#54606f; --tx3:#64707f;
    --accent:#1a73e8; --ok:#159a67; --warn:#b8790c; --err:#d33b3b;

    --code-bg:#f7f9fc; --code-hl:#1a5fae;
    --td-tx:#2b3644; --td-tx2:#4d5866; --row-line:#edf1f6;
    --btn2:#eef2f7; --btn2-bd:#bcc7d4;
    --learn-bd:#c3cedb;
    --ok-bg:#e0f5ea; --ok-bd:#8fd4b0;
    --info-bg:#eaf2fd; --info-bd:#c3dbf8;
  }
  *{box-sizing:border-box}
  body{
    margin:0;background:var(--bg);color:var(--tx);
    font:14px/1.7 -apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
  code{font-family:var(--mono);font-size:12.5px;background:var(--code-bg);border:1px solid var(--line);
       padding:1px 6px;border-radius:4px;color:var(--code-hl)}

  header{
    padding:22px 26px 16px;border-bottom:1px solid var(--line);background:var(--panel);
    position:sticky;top:0;z-index:10;
  }
  .top{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
  h1{margin:0;font-size:17px;font-weight:600;letter-spacing:.2px}
  .sub{font-size:12.5px;color:var(--tx3)}
  .top a{margin-left:auto;font-size:12.5px;color:var(--accent);text-decoration:none}
  .top a:hover{text-decoration:underline}

  .prog{display:flex;align-items:center;gap:14px;margin-top:14px}
  .bar{flex:1;height:5px;background:var(--line);border-radius:3px;overflow:hidden;max-width:420px}
  .bar i{display:block;height:100%;background:var(--ok);border-radius:3px;transition:width .2s}
  .pnum{font-family:var(--mono);font-size:12.5px;color:var(--tx2)}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
  .chip{
    font-size:11.5px;padding:3px 10px;border-radius:20px;border:1px solid var(--line);
    color:var(--tx2);background:var(--panel2);
  }
  .chip:hover{border-color:var(--btn2-bd);color:var(--tx)}
  .chip b{color:var(--tx);font-weight:500}

  main{max-width:900px;margin:0 auto;padding:10px 26px 90px}
  .phase{margin-top:30px}
  .phase-h{
    display:flex;align-items:baseline;gap:10px;padding-bottom:9px;border-bottom:1px solid var(--line);
  }
  .phase-h .n{font-family:var(--mono);font-size:12px;color:var(--accent);letter-spacing:.5px}
  .phase-h h2{margin:0;font-size:15px;font-weight:600}
  .phase-h .days{font-size:12px;color:var(--tx3);font-family:var(--mono)}
  .phase-h .goal{font-size:12.5px;color:var(--tx2);margin-left:auto;text-align:right;max-width:440px;line-height:1.5}

  .day{
    display:grid;grid-template-columns:52px 1fr;gap:0 16px;
    padding:16px 0;border-bottom:1px solid var(--row-line);
  }
  .day.done{opacity:.5}
  .day.hide{display:none}
  .left{display:flex;flex-direction:column;align-items:center;gap:6px;padding-top:2px}
  .dot{
    width:26px;height:26px;border-radius:50%;border:1px solid var(--line);flex:none;
    display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--tx3);
    transition:.15s;
  }
  .dot:hover{border-color:var(--ok);color:var(--ok)}
  .day.done .dot{background:var(--ok-bg);border-color:var(--ok-bd);color:var(--ok)}
  .dnum{font-family:var(--mono);font-size:10.5px;color:var(--tx3);letter-spacing:.3px}
  .day.done .dnum{color:var(--ok)}

  .t{font-size:14.5px;font-weight:600;margin:0 0 3px;letter-spacing:.2px}
  .min{font-size:11px;color:var(--tx3);font-family:var(--mono);margin-left:8px;font-weight:400}
  .row{display:grid;grid-template-columns:34px 1fr;gap:8px;margin-top:7px;font-size:13.2px;line-height:1.75}
  .tag{
    font-size:10.5px;letter-spacing:.5px;color:var(--tx3);padding-top:3px;
    border-left:2px solid var(--line);padding-left:7px;
  }
  .row.learn .tag{border-left-color:var(--learn-bd)}
  .row.todo .tag{border-left-color:var(--accent)}
  .row.check .tag{border-left-color:var(--warn)}
  .row p{margin:0;color:var(--td-tx)}
  .row.check p{color:var(--td-tx2)}
  .golink{
    display:inline-block;margin-top:8px;font-size:12.5px;color:var(--accent);text-decoration:none;
    border:1px solid var(--info-bd);border-radius:6px;padding:3px 10px;
  }
  .golink:hover{background:var(--info-bg)}
  .filter{
    display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--tx3);margin-top:12px;
    cursor:pointer;user-select:none;
  }
  .filter input{accent-color:var(--ok);cursor:pointer}

  #themeBtn{
    margin-left:10px;width:29px;height:29px;flex:none;border:1px solid var(--btn2-bd);
    border-radius:8px;background:var(--panel2);color:var(--tx2);font-size:14px;
    display:inline-flex;align-items:center;justify-content:center;line-height:1;
    transition:.15s;user-select:none;vertical-align:middle;
  }
  #themeBtn svg{display:none;width:15px;height:15px;pointer-events:none}
  html[data-theme="light"] #themeBtn .ic-moon{display:block}
  html:not([data-theme="light"]) #themeBtn .ic-sun{display:block}
  #themeBtn:hover{border-color:var(--btn2-bd);color:var(--tx);transform:rotate(-12deg)}

  @media(max-width:700px){
    header{padding:16px}
    main{padding:6px 16px 60px}
    .day{grid-template-columns:40px 1fr;gap:0 10px}
    .phase-h .goal{display:none}
    .sub{display:none}
  }
</style>
<script>
/* 主题：尽早应用，避免刷新时先闪一下暗色；?theme=light|dark 可强制指定 */
(function () {
  try {
    var q = (location.search.match(/[?&]theme=(light|dark)/) || [])[1];
    var t = q || localStorage.getItem('sqllab-theme');
    if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
  } catch (e) {}
})();
</script>
</head>
<body>

<header>
  <div class="top">
    <h1>45 天 SQL 学习计划</h1>
    <span class="sub">每天 30-60 分钟 · 从语法零起点到做完 13 道财务工单</span>
    <a href="index.html">← 回到练习台</a>
    <button id="themeBtn" title="切换深色 / 浅色主题"><svg class="ic-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.1"/><path d="M12 2.6v2.1M12 19.3v2.1M2.6 12h2.1M19.3 12h2.1M5.3 5.3l1.5 1.5M17.2 17.2l1.5 1.5M18.7 5.3l-1.5 1.5M6.8 17.2l-1.5 1.5"/></svg><svg class="ic-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M20.2 14.8A8.4 8.4 0 1 1 9.2 3.8a6.8 6.8 0 0 0 11 11z"/></svg></button>
  </div>
  <div class="prog">
    <div class="bar"><i id="bar"></i></div>
    <span class="pnum" id="pnum">0 / 45</span>
    <label class="filter"><input type="checkbox" id="onlyTodo"> 只看未完成</label>
  </div>
  <div class="chips" id="chips"></div>
</header>

<main id="list"></main>

<script src="src/plan-data.js"></script>
<script>
const KEY = 'sql-plan-done';
let done = [];
try { done = JSON.parse(localStorage.getItem(KEY) || '[]'); } catch (e) { done = []; }

/* ---------- 主题切换 ---------- */
const THEME_KEY = 'sqllab-theme';
function curTheme() {
  return document.documentElement.dataset.theme === 'light' ? 'light' : 'dark';
}
function paintThemeBtn() {
  const btn = document.getElementById('themeBtn');
  if (!btn) return;
  const light = curTheme() === 'light';
  btn.title = light ? '切换到深色主题' : '切换到浅色主题';
  btn.setAttribute('aria-label', btn.title);
}
function setTheme(t) {
  document.documentElement.dataset.theme = t;
  try { localStorage.setItem(THEME_KEY, t); } catch (e) {}
  /* 手动切换后清掉 ?theme=，避免刷新时被 URL 覆盖 */
  try {
    const u = new URL(location.href);
    if (u.searchParams.has('theme')) {
      u.searchParams.delete('theme');
      history.replaceState(null, '', u.pathname + (u.search || '') + u.hash);
    }
  } catch (e) {}
  paintThemeBtn();
}
paintThemeBtn();
document.getElementById('themeBtn').addEventListener('click', () => {
  setTheme(curTheme() === 'light' ? 'dark' : 'light');
});

function isDone(d) { return done.indexOf(d) >= 0; }
function toggle(d) {
  if (isDone(d)) done = done.filter((x) => x !== d);
  else done.push(d);
  try { localStorage.setItem(KEY, JSON.stringify(done)); } catch (e) {}
  render();
}

function taskLink(text) {
  const m = text.match(/\bT(0[1-9]|1[0-3])\b/);
  if (!m) return '';
  const id = 'T' + m[1];
  return '<a class="golink" href="index.html#' + id + '">打开 ' + id + ' →</a>';
}

function render() {
  const n = done.filter((d) => d >= 1 && d <= 45).length;
  document.getElementById('bar').style.width = (n / 45 * 100) + '%';
  document.getElementById('pnum').textContent = n + ' / 45';
  document.getElementById('pnum').style.color = n === 45 ? 'var(--ok)' : 'var(--tx2)';
  document.getElementById('pnum').textContent = n + ' / 45' + (n === 45 ? '　全部完成' : '');

  document.getElementById('chips').innerHTML = PHASES.map((p) =>
    '<button class="chip" data-p="' + p.id + '"><b>' + p.name + '</b>　Day ' + p.days + '</button>'
  ).join('');
  document.querySelectorAll('.chip').forEach((c) => {
    c.onclick = () => {
      const el = document.getElementById('phase-' + c.dataset.p);
      if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
    };
  });

  const onlyTodo = document.getElementById('onlyTodo').checked;
  let html = '';
  PHASES.forEach((p) => {
    const days = PLAN.filter((x) => x.p === p.id);
    html += '<div class="phase" id="phase-' + p.id + '">' +
      '<div class="phase-h"><span class="n">' + p.id + '</span><h2>' + p.name + '</h2>' +
      '<span class="days">Day ' + p.days + '</span>' +
      '<span class="goal">' + p.goal + '</span></div>';
    days.forEach((x) => {
      const d = isDone(x.d);
      const hide = onlyTodo && d ? ' hide' : '';
      html += '<div class="day' + (d ? ' done' : '') + hide + '" id="day-' + x.d + '">' +
        '<div class="left"><button class="dot" data-d="' + x.d + '">' + (d ? '✓' : '') + '</button>' +
        '<span class="dnum">' + String(x.d).padStart(2, '0') + '</span></div>' +
        '<div class="body">' +
        '<div class="t">' + x.t + '<span class="min">' + x.min + ' min</span></div>' +
        '<div class="row learn"><span class="tag">学</span><p>' + x.learn + '</p></div>' +
        '<div class="row todo"><span class="tag">做</span><p>' + x.todo + '</p></div>' +
        '<div class="row check"><span class="tag">验收</span><p>' + x.check + '</p></div>' +
        taskLink(x.todo + ' ' + x.check + ' ' + x.t) +
        '</div></div>';
    });
    html += '</div>';
  });
  document.getElementById('list').innerHTML = html;
  document.querySelectorAll('.dot').forEach((b) => {
    b.onclick = () => toggle(+b.dataset.d);
  });
}

document.getElementById('onlyTodo').onchange = render;
render();

window.addEventListener('hashchange', () => {
  const el = document.querySelector(location.hash);
  if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
});
</script>
</body>
</html>
